privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'UpAssist.Neos.UserAvatar:Own':
      label: 'See, upload and remove your own profile photo'
      matcher: 'method(UpAssist\Neos\UserAvatar\Controller\AvatarController->(show|settings|upload|remove)Action())'

roles:
  # Every authenticated user, so custom backend roles that do not extend Neos.Neos:AbstractEditor
  # get it too. The controller only acts for an account of the 'Neos.Neos:Backend' provider
  # (UserAvatarService::getCurrentUser()), and only on that user's own photo: an account of
  # another provider, such as a frontend login, gets 404 or 403.
  'Neos.Flow:AuthenticatedUser':
    privileges:
      -
        privilegeTarget: 'UpAssist.Neos.UserAvatar:Own'
        permission: GRANT
